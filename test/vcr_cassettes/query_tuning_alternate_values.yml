        from this source but further reproduction or distribution in any format is
        prohibited without written permission.","uri":null}],"score":"13.577772","sourceLink":"https://dspace.mit.edu/handle/1721.1/112018","summary":["My
        dissertation examines the controversy over transcranial direct current stimulation
        (tDCS), a noninvasive form of brain stimulation that is thought to provide
        a constant low level of electrical current to the brain. Although scientists
        have been experimenting with tDCS in both healthy and clinical populations
        for the last fifteen years, in late 2011 a movement arose wherein \"lay\"
        individuals began constructing their own tDCS devices, or purchasing consumer
        devices, to stimulate their brains outside of academic or medical settings
        for self-improvement purposes. Not surprisingly, the lay FAKE_TIMDEX_INDEX
        of tDCS has not been well received by researchers, who have termed it \"fringe\"
        or \"unorthodox.\" This work studies the conflict over tDCS: what is tDCS,
        who gets to FAKE_TIMDEX_INDEX it, and who studies it? What are the multiple
        social worlds that tDCS inhabits, how is the technology interpreted and utilized
        in each, and how does each group authorize or discredit the other''s FAKE_TIMDEX_INDEX?
        My dissertation incorporates interviews, observations, an online survey, archival
        research, and legal analyses to probe aspects of the controversy from different
        angles. The first chapter introduces tDCS technology and chronicles the rise
        of the do-it-yourself movement and the subsequent emergence of direct-to-consumer
        devices. In the second chapter, I present an in-depth qualitative study of
        the practices of home FAKE_TIMDEX_INDEXrs of tDCS; the third chapter offers
        a quantitative look at those who have purchased a consumer tDCS device, based
        on the results of an online survey. The fourth chapter addresses regulatory
        issues surrounding consumer tDCS devices, providing a comprehensive analysis
        of relevant legal doctrines and laws. The fifth chapter covers historical
        precedents for the home FAKE_TIMDEX_INDEX of electrical stimulation, with
        a focus on FAKE_TIMDEX_INDEXs of the medical battery between 1870 and 1920
        in the United States. In the sixth chapter, I compare the medical battery
        to tDCS, arguing that the controversy over the home FAKE_TIMDEX_INDEX of tDCS
        is not novel or even surprising, but rather the latest wave in a series of
        ongoing attempts by lay individuals to utilize electricity for therapeutic
