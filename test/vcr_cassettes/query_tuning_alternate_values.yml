        without written \npermission. See provided URL for inquiries about permission.","uri":null}],"score":"18.393524","sourceLink":"https://dspace.mit.edu/handle/1721.1/68465","summary":["The
        United States is the world leader in development and manufacture of medical
        devices. Even with this leadership position, there is evidence that the US
        is often not the first country to have new medical technology approved for
        patient FAKE_TIMDEX_INDEX. In many cases, the European Union is the first
        geographic region to approve a new medical technology for sale, with US approval
        coming later. This delay in approval of new devices between the EU and US
        is referred to as the \"device lag.\" However, the extent or history of this
        lag over time and for different device types has not been examined. This thesis
        evaluated if a device approval lag has developed between US and EU at any
        time over the past 20 years and whether a device lag continues to exist today.
        US and EU regulatory approval data for 135 medical devices in three innovative
        medical device segments were collected and analyzed to evaluate the extent
        and history of the approval lag between the European Union and the United
        States. The collected approval data revealed a consistent approval lag between
        the US and EU in each of the three medical device segments explored in this
        study. Throughout the entire 20+ years of study, the United States had an
        average approval lag to the European Union in each of the three device segments,
        and an average lag for all devices of 21 months or almost 2 years (Ho: p.
        = 0, p = 8.2E-12). Furthermore, the device lag in these three segments has
        grown in recent years. These data are striking becaFAKE_TIMDEX_INDEX they
        show, perhaps for the first time, that an approval lag has existed for medical
        devices between the US and EU for the past 20 years - since the beginning
        of the pan-European device regulatory system in the mid-1990s. The device
        lag is a FAKE_TIMDEX_INDEXful metric for comparing the attractiveness of two
        markets for medical technology and may signal important changes in the medical
        technology industry. Furthermore, the existence of a persistent device approval
        lag in the United States may have significant implications for patients and
